<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>pipabobik — зараз грає</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Віджет «зараз грає» для OBS (Джерело → Браузер, 520 × 160).
  Параметри адреси:
      ?idle=hide   — ховати віджет, коли нічого не грає (за замовчуванням)
      ?idle=hint   — показувати підказку «замов трек»
      ?cmd=!sr     — яку команду показувати в підказці
      ?scale=1.25  — масштаб
      ?demo=1      — демо-трек (для налаштування в OBS без бота); ?demo=cycle — демо змінює треки
-->
<style>
  /* Fixel — український шрифт від MacPaw (SIL OFL) */
  @font-face { font-family: "Fixel Display"; font-weight: 700; font-display: block; src: url("/static/fonts/FixelDisplay-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Fixel Text"; font-weight: 500; font-display: block; src: url("/static/fonts/FixelText-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Fixel Text"; font-weight: 600; font-display: block; src: url("/static/fonts/FixelText-SemiBold.woff2") format("woff2"); }

  /* кольори з обкладинки плавно перетікають (лише кілька маленьких елементів, без перемальовування всього віджета) */
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #ffd6ea; }
  @property --accent-soft { syntax: "<color>"; inherits: true; initial-value: rgba(255, 214, 234, .2); }

  :root { --scale: 1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: "Fixel Text", "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  .stage {
    position: absolute; left: 14px; top: 14px; transform-origin: 0 0;
    transform: scale(var(--scale)); opacity: 1;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .stage.hidden { opacity: 0; transform: scale(var(--scale)) translateY(10px); }
  .stage.gone { visibility: hidden; }

  .card {
    position: relative; width: 470px; height: 112px; padding: 14px 18px 14px 14px;
    display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center;
    border-radius: 22px; overflow: hidden; isolation: isolate;
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
    transition: --accent 1.1s ease, --accent-soft 1.1s ease;
  }
  /* напівпрозорий фон у кольорах обкладинки: два шари, новий плавно проявляється поверх старого */
  .tint { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 1.1s ease; will-change: opacity; }
  .tint.on { opacity: 1; }
  /* прозорий фон: рамка й тінь теж слабшають, а текст отримує власну тінь, щоб читався на трансляції */
  .card { --bg: 1; border-color: rgba(255, 255, 255, calc(.09 * var(--bg))); box-shadow: 0 10px 28px rgba(0, 0, 0, calc(.28 * var(--bg))); }
  .card.see .title, .card.see .artist, .card.see .time { text-shadow: 0 1px 3px rgba(0, 0, 0, .75), 0 0 8px rgba(0, 0, 0, .45); }

  .cover { position: relative; width: 84px; height: 84px; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); background: rgba(255, 255, 255, .08); }
  .cover .img { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transform: scale(1.06); transition: opacity .55s ease, transform .55s cubic-bezier(.2, .8, .2, 1); }
  .cover .img.on { opacity: 1; transform: none; }
  .cover .note { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(135deg, #ff4fa3, #b78cff); opacity: 0; transition: opacity .55s ease; }
  .cover .note svg { width: 38px; height: 38px; fill: rgba(255, 255, 255, .92); }
  .card.nocover .cover .note { opacity: 1; }

  .meta { min-width: 0; display: grid; gap: 3px; }
  .titleWrap { overflow: hidden; white-space: nowrap; }
  .titleWrap:not(.fits) { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .title { display: inline-block; font-family: "Fixel Display", "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; letter-spacing: .005em; }
  /* довга назва повільно прокручується (лише transform — відеокарта, процесор не навантажується) */
  .title.scroll { animation: marquee var(--dur, 12s) ease-in-out infinite; }
  @keyframes marquee { 0%, 18% { transform: translateX(0); } 50%, 68% { transform: translateX(var(--shift)); } 100% { transform: translateX(0); } }

  .sub { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 500; line-height: 1.25; }
  .artist { color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .by {
    flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 170px;
    padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .by svg { flex: none; width: 12px; height: 12px; fill: currentColor; }
  .by[hidden] { display: none; }
  .by .i-pl, .by.pl .i-req { display: none; }
  .by.pl .i-pl { display: block; }

  .progress { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 7px; }
  .time { font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .78); font-variant-numeric: tabular-nums; min-width: 30px; }
  .time:last-child { text-align: right; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  .fill { height: 100%; width: 100%; border-radius: 3px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform 1s linear, opacity .3s; }
  .fill.jump { transition: opacity .3s; }
  .card.paused .fill { opacity: .55; }

  /* підказка «замов трек» */
  .card.hint .progress { visibility: hidden; }
  .card.hint .cover .note { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .tint, .cover .img, .fill { transition: none !important; }
    .title.scroll { animation: none; }
  }
</style>
</head>
<body>
<div class="stage hidden gone" id="stage">
  <div class="card" id="card">
    <div class="tint" id="tintA"></div>
    <div class="tint" id="tintB"></div>
    <div class="cover">
      <div class="img" id="imgA"></div>
      <div class="img" id="imgB"></div>
      <div class="note"><svg viewBox="0 0 24 24"><path d="M9 18.5a3 3 0 11-2-2.83V5l12-2v12.5a3 3 0 11-2-2.83V7.1L9 8.4z"/></svg></div>
    </div>
    <div class="meta">
      <div class="titleWrap fits" id="titleWrap"><span class="title" id="title"></span></div>
      <div class="sub">
        <span class="artist" id="artist"></span>
        <span class="by" id="by" hidden><svg class="i-req" viewBox="0 0 24 24"><path d="M12 3a8 8 0 00-8 8v6a3 3 0 003 3h1v-7H6v-2a6 6 0 0112 0v2h-2v7h1a3 3 0 003-3v-6a8 8 0 00-8-8z"/></svg><svg class="i-pl" viewBox="0 0 24 24"><path d="M3 5h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-10h4v2h-2v9.5a3 3 0 11-2-2.83z"/></svg><span id="byName"></span></span>
      </div>
      <div class="progress">
        <span class="time" id="cur">0:00</span>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <span class="time" id="dur">0:00</span>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const idleMode = qs.get("idle") || "hide";
  const cmd = qs.get("cmd") || "!трек";
  document.documentElement.style.setProperty("--scale", qs.get("scale") || 1);

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), card = $("card");
  let state = null, receivedAt = 0, currentId = null;
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

  // ── кольори з обкладинки ──
  // Обкладинка зменшується до 24×24 і рахується один раз на трек: це мілісекунда роботи.
  const PINK = { h: 330, s: 0.7, l: 0.6 };
  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return { h: 0, s: 0, l };
    const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { h: h * 60, s, l };
  }
  function dominant(img) {
    try {
      const c = document.createElement("canvas");
      c.width = c.height = 24;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.drawImage(img, 0, 0, 24, 24);
      const px = x.getImageData(0, 0, 24, 24).data;
      // кошики за відтінком; яскраві насичені кольори важать більше, ніж майже чорні, білі й сірі
      const bins = Array.from({ length: 18 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
      let grey = { w: 0, l: 0 };
      for (let i = 0; i < px.length; i += 4) {
        const { h, s, l } = rgb2hsl(px[i], px[i + 1], px[i + 2]);
        const w = s * (1 - Math.abs(l - 0.5) * 1.6);
        grey.w += 1; grey.l += l;
        if (w <= 0.05) continue;
        const bn = bins[Math.floor(h / 20) % 18];
        bn.w += w; bn.r += px[i] * w; bn.g += px[i + 1] * w; bn.b += px[i + 2] * w;
      }
      const best = bins.reduce((a, b) => (b.w > a.w ? b : a));
      if (best.w < 8) return { h: 0, s: 0, l: grey.l / grey.w };  // чорно-біла обкладинка
      return rgb2hsl(best.r / best.w, best.g / best.w, best.b / best.w);
    } catch { return null; }  // обкладинку з іншого сайту не можна прочитати — лишаємо колір як був
  }
  const hsla = (h, s, l, a = 1) => `hsla(${h.toFixed(0)}, ${(s * 100).toFixed(0)}%, ${(l * 100).toFixed(0)}%, ${a})`;
  let tintOn = $("tintA");
  // «Рожевий віджет» у застосунку: колір завжди фірмовий, не з обкладинки
  let forcePink = qs.get("pink") === "1", coverColor = PINK, painted = null;
  // щільність фону з застосунку: 100 — суцільний один колір без прозорості, 0 — без фону, 80 — стандартний вигляд
  let opacity = 80;
  function paint(c, force) {
    coverColor = c;
    if (forcePink) c = PINK;
    if (painted === c && !force) return;
    painted = c;
    const { h } = c;
    const s = c.s < 0.08 ? 0 : Math.min(1, c.s);
    const k = opacity / 80;  // 80 — як задумано
    const bg = opacity >= 100
      // суцільний один колір
      ? hsla(h, Math.min(s, 0.75), 0.2, 1)
      // темний напівпрозорий фон того ж відтінку + м'яке сяйво від обкладинки
      : `radial-gradient(190px 150px at 56px 50%, ${hsla(h, Math.min(s, 0.9), 0.45, Math.min(1, 0.62 * k))}, transparent 72%),
         linear-gradient(100deg, ${hsla(h, Math.min(s, 0.75), 0.22, Math.min(1, 0.82 * k))}, ${hsla(h, Math.min(s, 0.6), 0.14, Math.min(1, 0.78 * k))})`;
    const next = tintOn === $("tintA") ? $("tintB") : $("tintA");
    next.style.background = bg;
    next.classList.add("on");
    tintOn.classList.remove("on");
    tintOn = next;
    const accent = s === 0 ? hsla(0, 0, 0.9) : hsla(h, Math.max(s, 0.6), 0.78);
    card.style.setProperty("--accent", accent);
    card.style.setProperty("--accent-soft", s === 0 ? "rgba(255,255,255,.16)" : hsla(h, Math.max(s, 0.6), 0.7, 0.2));
  }

  // прозорість віджета з налаштувань застосунку: 100% — суцільний колір, 0% — без фону
  function setOpacity(o) {
    o = o === undefined || o === null || o === "" ? 80 : Math.max(0, Math.min(100, +o));
    if (o === opacity && card.dataset.op) return;
    opacity = o;
    card.dataset.op = o;
    card.style.setProperty("--bg", Math.min(1, o / 80).toFixed(2));
    card.classList.toggle("see", o <= 45);  // фону мало — текст із тінню
    paint(coverColor, true);
  }
  setOpacity(qs.get("opacity"));

  // ── обкладинка ──
  // Обкладинки йдуть через бота (/cover): так з них можна взяти колір.
  const onBot = location.protocol.startsWith("http") && !qs.get("demo");
  const viaBot = (u) => (onBot && /^https?:/.test(u) ? `/cover?u=${encodeURIComponent(u)}` : u);
  function load(url) {
    return new Promise((done) => {
      if (!url) return done(null);
      const im = new Image();
      let fin = false;
      const end = (v) => { if (!fin) { fin = true; done(v); } };
      im.onload = () => end(im.naturalWidth > 120 ? im : null);  // сіра заглушка YouTube 120×90 — «немає обкладинки»
      im.onerror = () => end(null);
      setTimeout(() => end(null), 8000);
      im.src = url;
    });
  }
  // Кадр з відео YouTube: hqdefault — 4:3 з чорними смугами згори й знизу; беремо 16:9 без смуг
  // (найбільший, що є: maxresdefault → hq720 → mqdefault). Квадратна обкладинка YouTube Music — першою.
  const ytVid = (u) => (String(u || "").match(/i\.ytimg\.com\/vi(?:_webp)?\/([\w-]{11})\//) || [])[1] || "";
  function coverTries(t) {
    if (!t) return [];
    const out = [];
    if (t.cover && !ytVid(t.cover)) out.push(t.cover);
    const vid = ytVid(t.cover) || (t.video_id && !/^demo/.test(t.video_id) ? t.video_id : "");
    if (vid) for (const n of ["maxresdefault", "hq720", "mqdefault"]) out.push(`https://i.ytimg.com/vi/${vid}/${n}.jpg`);
    if (!out.length && t.cover) out.push(t.cover);
    return out;
  }
  let imgOn = $("imgA"), coverToken = 0;
  async function setCover(t) {
    const my = ++coverToken;
    const tries = coverTries(t);
    let im = null, src = "";
    for (const u of tries) { src = viaBot(u); im = await load(src); if (im) break; }
    if (my !== coverToken) return;  // поки вантажилось, трек уже змінився
    card.classList.toggle("nocover", !im);
    const next = imgOn === $("imgA") ? $("imgB") : $("imgA");
    if (im) {
      next.style.backgroundImage = `url("${src.replace(/"/g, "%22")}")`;
      next.classList.add("on");
    }
    imgOn.classList.remove("on");
    if (im) imgOn = next;
    paint((im && dominant(im)) || PINK);
  }

  // ── назва, виконавець, хто замовив ──
  function fitTitle() {
    const wrap = $("titleWrap"), t = $("title");
    t.classList.remove("scroll");
    const overflow = t.scrollWidth - wrap.clientWidth;
    wrap.classList.toggle("fits", overflow <= 0);
    if (overflow > 0) {
      t.style.setProperty("--shift", `-${overflow + 26}px`);
      t.style.setProperty("--dur", `${Math.max(9, overflow / 16 + 7)}s`);
      t.classList.add("scroll");
    }
  }
  function fillTrack(now) {
    $("title").textContent = now.title;
    $("artist").textContent = now.artist || "";
    $("dur").textContent = now.duration ? fmt(now.duration) : "";
    // замовлення — нік глядача; фонова музика — «з плейлиста стримерки»
    const by = now.source === "request" && now.requested_by;
    $("by").hidden = !by && now.source !== "fallback";
    $("by").classList.toggle("pl", !by);
    $("byName").textContent = by ? now.requested_by : "з плейлиста стримерки";
    setCover(now);
    requestAnimationFrame(fitTitle);
  }

  let lastFill = -1;
  function setFill(f) {
    f = Math.max(0, Math.min(1, f || 0));
    if (Math.abs(f - lastFill) < 0.0005) return;
    const el = $("fill");
    el.classList.toggle("jump", Math.abs(f - lastFill) > 0.03);  // новий трек чи перемотка — без «проїзду»
    lastFill = f;
    el.style.transform = `scaleX(${f.toFixed(4)})`;
  }

  function render() {
    const now = state && state.now;
    const live = state && ["playing", "paused", "loading"].includes(state.status);
    card.classList.toggle("paused", !state || state.status !== "playing");
    if (now && live) {
      card.classList.remove("hint");
      show();
      if (now.video_id !== currentId) { currentId = now.video_id; fillTrack(now); }
      return;
    }
    currentId = null;
    if (idleMode === "hint" && state && state.active) {
      card.classList.add("hint");
      show();
      $("title").textContent = "Замов трек!";
      $("artist").textContent = `${cmd} виконавець — назва`;
      $("by").hidden = true;
      setCover(null);
      requestAnimationFrame(fitTitle);
    } else {
      hide();
    }
  }

  let goneTimer = null;
  function show() { clearTimeout(goneTimer); stage.classList.remove("gone", "hidden"); }
  function hide() {
    if (stage.classList.contains("hidden")) return;
    stage.classList.add("hidden");
    goneTimer = setTimeout(() => stage.classList.add("gone"), 600);
  }

  function tick() {
    if (document.hidden || stage.classList.contains("hidden")) return;
    const now = state && state.now;
    if (now && state.status !== "loading") {
      let el = now.elapsed || 0;
      if (state.status === "playing") el += (performance.now() - receivedAt) / 1000;
      if (now.duration) el = Math.min(el, now.duration);
      $("cur").textContent = fmt(el);
      setFill(now.duration ? el / now.duration : 0);
    } else if (now) {
      $("cur").textContent = "0:00"; setFill(0);
    }
  }

  function apply(s) {
    state = s; receivedAt = performance.now();
    setOpacity(qs.has("opacity") ? qs.get("opacity") : s.widget && s.widget.opacity);
    const pink = qs.get("pink") === "1" || !!(s.widget && s.widget.pink);
    if (pink !== forcePink) { forcePink = pink; paint(coverColor); }  // плавно перефарбовується
    render(); tick();
  }

  // ── демо: обкладинки малюються тут же, щоб віджет можна було налаштувати без бота й інтернету ──
  function demoCover(c1, c2, c3) {
    const c = document.createElement("canvas");
    c.width = c.height = 300;
    const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 300, 300);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.fillStyle = g; x.fillRect(0, 0, 300, 300);
    x.globalAlpha = 0.55;
    for (let i = 0; i < 7; i++) {
      x.beginPath(); x.fillStyle = i % 2 ? c3 : "#ffffff";
      x.arc(60 + i * 32, 150 + Math.sin(i) * 70, 70 - i * 7, 0, Math.PI * 2); x.fill();
    }
    return c.toDataURL("image/png");
  }
  const demo = window.PB_DEMO || qs.get("demo");  // PB_DEMO — для сторінки попереднього перегляду
  if (demo) {
    const tracks = [
      { video_id: "demo1", title: qs.get("title") || "LEMONADE", artist: qs.get("artist") || "aespa", duration: 187, requested_by: qs.get("user") || "pipa_fan", source: "request", cover: qs.get("cover") || demoCover("#d6f04a", "#5a8f1c", "#f6ff9e") },
      { video_id: "demo2", title: "Обійми", artist: "Океан Ельзи", duration: 236, requested_by: "kotyk_ua", source: "request", cover: demoCover("#ff6aa8", "#7a1f6b", "#ffc2dd") },
      { video_id: "demo3", title: "Шум", artist: "Go_A", duration: 181, source: "fallback", cover: demoCover("#38c8f0", "#123a7a", "#9ff3ff") },
      { video_id: "demo4", title: "Стефанія (Mama) — Live at Eurovision Song Contest 2022", artist: "Kalush Orchestra", duration: 204, requested_by: "найкращий_глядач_твічу", source: "request", cover: demoCover("#ffb547", "#9a3c0c", "#ffe2a8") },
    ];
    let i = Math.max(0, (parseInt(demo, 10) || 1) - 1);  // ?demo=2 — другий демо-трек
    const play = () => apply({ status: "playing", active: true, now: { ...tracks[i % tracks.length], elapsed: 22 + (i * 31) % 90 } });
    play();
    if (demo === "cycle") setInterval(() => { i++; play(); }, 6000);
  } else {
    const connect = () => {
      const es = new EventSource("/api/events");
      es.onmessage = (e) => apply(JSON.parse(e.data));
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    };
    connect();
  }
  setInterval(tick, 1000);  // раз на секунду + плавний CSS-перехід
  window.addEventListener("resize", fitTitle);
})();
</script>
</body>
</html>
