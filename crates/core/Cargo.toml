[package]
name = "pipabobik-core"
version.workspace = true
edition.workspace = true
description = "Ядро pipabobik: черга, YouTube Music, mpv, чат Twitch, локальний сервер"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
toml = "0.8"
regex = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
